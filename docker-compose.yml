services:
  app:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/remotion/node_modules
    environment:
      - CHROME_BIN=/usr/bin/chromium
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/animation_pipeline
    ports:
      - "5000:5000"
      - "5173:5173"
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: animation_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGPORT:-5434}:5432"
    volumes:
      - animation_pipeline_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animation_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  animation_pipeline_pgdata:
