qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NkxHwAAANIAAAAAKqqqqqqqqpMQU1FMy4xMDCqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NkxHwAAANIAAAAAKqqqqqqqqpMQU1FMy4xMDCqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NkxHwAAANIAAAAAKqqqqqqqqpMQU1FMy4xMDCqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NkxHwAAANIAAAAAKqqqqqqqqpMQU1FMy4xMDCqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NkxHwAAANIAAAAAKqqqqqqqqpMQU1FMy4xMDCqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NkxHwAAANIAAAAAKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"></audio>
<script>
const W=1080,H=1920,c=document.getElementById("c"),x=c.getContext("2d");c.width=W;c.height=H;
const audioEl=document.getElementById("voice");
const P="#5b1a78",D="#1d1a1a",BG="#fdf3d0",DUR=3,CX=540,CY=720,R=250;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=u=>1-Math.pow(1-u,3),eb=u=>{const s=1.70158;u-=1;return u*u*((s+1)*u+s)+1};
const hv=(r)=>[...Array(6)].map((_,i)=>{const a=(-90+60*i)*Math.PI/180;return[r*Math.cos(a),r*Math.sin(a)]});
const HX=hv(R),CH=hv(R+48).map(p=>[p[0]+CX,p[1]+CY]);
const NODES=[5,1,3].map(i=>[CX+HX[i][0]*1.04,CY+HX[i][1]*1.04]);

function gear(r0,r1,n){x.beginPath();const w=Math.PI*2/n;let f=1;
 for(let k=0;k<n;k++){const a=k*w;[[a,r0],[a+w*.15,r1],[a+w*.42,r1],[a+w*.57,r0]].forEach(p=>{
  const px=p[1]*Math.cos(p[0]),py=p[1]*Math.sin(p[0]);f?(x.moveTo(px,py),f=0):x.lineTo(px,py)})}
 x.closePath()}

function draw(t){
 const g=x.createRadialGradient(CX,CY,60,CX,CY,1300);g.addColorStop(0,"#fff9e2");g.addColorStop(1,BG);
 x.fillStyle=g;x.fillRect(0,0,W,H);

 // hexagon
 const hs=eb(seg(t,0,.7));
 x.save();x.translate(CX,CY);x.rotate((1-eo(seg(t,0,.8)))*-1.05);x.scale(hs,hs);
 x.beginPath();HX.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();
 x.fillStyle=P;x.fill();x.restore();

 // spokes + nodes
 NODES.forEach((n,i)=>{
  const u=eo(seg(t,.5+i*.12,1.0+i*.12)),ex=n[0]+(CX-n[0])*.5*u,ey=n[1]+(CY-n[1])*.5*u;
  x.strokeStyle=P;x.lineWidth=9;x.lineCap="round";x.beginPath();x.moveTo(n[0],n[1]);x.lineTo(ex,ey);x.stroke();
  const s=eb(seg(t,.5+i*.12,.9+i*.12))*(1+.07*Math.sin(t*7+i));
  x.beginPath();x.arc(n[0],n[1],36*s,0,7);x.fillStyle=P;x.fill();x.lineWidth=7;x.strokeStyle="#9a4cc2";x.stroke()});

 // rolling chain
 const ca=seg(t,.3,.6)*(1-seg(t,2,2.45));
 if(ca>0){const ph=.6*t+.25*t*t,N=42;x.globalAlpha=ca;
  for(let k=0;k<N;k++){const e=((k/N+ph)%1)*6,i=Math.floor(e),f=e-i,A=CH[i],B=CH[(i+1)%6];
   x.save();x.translate(A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f);x.rotate(Math.atan2(B[1]-A[1],B[0]-A[0]));
   x.lineWidth=6;x.strokeStyle=P;x.fillStyle=P;x.beginPath();
   if(k%2){x.roundRect(-9,-9,18,18,6);x.fill()}else{x.roundRect(-21,-11,42,22,11);x.stroke()}
   x.restore()}
  x.globalAlpha=1}

 // gear + B
 const gs=eb(seg(t,.6,1.3));
 x.save();x.translate(CX,CY);x.scale(gs,gs);
 x.save();x.rotate(t*2.2);gear(100,128,12);x.fillStyle=BG;x.fill();x.restore();
 x.beginPath();x.arc(0,0,76,0,7);x.fillStyle=P;x.fill();
 x.fillStyle=BG;x.font="700 130px Georgia,serif";x.textAlign="center";x.textBaseline="middle";x.fillText("B",0,6);
 x.restore();

 // wordmark BITTRIX
 x.textBaseline="alphabetic";x.textAlign="left";x.font="italic 900 168px \"Arial Black\",Impact,Arial,sans-serif";
 const L="BITTRIX".split(""),ws=L.map(l=>x.measureText(l).width),tw=ws.reduce((a,b)=>a+b,0);let px=CX-tw/2;
 L.forEach((l,i)=>{const u=eo(seg(t,1.4+i*.07,1.9+i*.07));x.globalAlpha=u;x.fillStyle=P;x.fillText(l,px+(1-u)*-110,1190);px+=ws[i]});
 x.globalAlpha=1;

 // technologies
 const tu=eo(seg(t,1.9,2.5));x.globalAlpha=tu;x.font="500 46px Arial,sans-serif";x.fillStyle=D;
 const T="TECHNOLOGIES".split(""),sp=10+16*tu,tws=T.map(l=>x.measureText(l).width),tt=tws.reduce((a,b)=>a+b,0)+sp*(T.length-1);let tx=CX-tt/2;
 T.forEach((l,i)=>{x.fillText(l,tx,1272);tx+=tws[i]+sp});x.globalAlpha=1;
 const bw=520*eo(seg(t,2.1,2.6));x.fillStyle=P;x.fillRect(CX-bw/2,1316,bw,7);

 // shine
 const sh=seg(t,2.35,2.95);
 if(sh>0&&sh<1){const p=-400+(W+800)*sh,gr=x.createLinearGradient(p-140,0,p+140,280);
  gr.addColorStop(0,"rgba(255,255,255,0)");gr.addColorStop(.5,"rgba(255,255,255,.4)");gr.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=gr;x.fillRect(0,0,W,H)}
}

let t0=performance.now(),rec=false,mr=null,voicePlayed=false;
function loop(now){let t=(now-t0)/1000;
 if(!rec&&t>DUR+.7){t0=now;t=0;voicePlayed=false}
 if(t>=0.6&&!voicePlayed){
   voicePlayed=true;
   audioEl.currentTime=0;
   audioEl.play().catch(()=>{});
 }
 if(rec&&t>=DUR+.1&&mr&&mr.state==="recording")mr.stop();
 draw(Math.min(t,DUR));requestAnimationFrame(loop)}
requestAnimationFrame(loop);

document.getElementById("rp").onclick=()=>{
  if(!rec){t0=performance.now();voicePlayed=false;audioEl.currentTime=0;audioEl.play().catch(()=>{});}
};

const btn=document.getElementById("rec");
btn.onclick=async()=>{
 if(!window.MediaRecorder){alert("Recording is not supported in this browser. Use Chrome or Edge.");return}
 const m=["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm"].find(m=>MediaRecorder.isTypeSupported(m));
 if(!m){alert("No supported video format found.");return}

 try {
   const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
   const source=audioCtx.createMediaElementSource(audioEl);
   const dest=audioCtx.createMediaStreamDestination();
   source.connect(dest);
   source.connect(audioCtx.destination);

   const canvasStream=c.captureStream(30);
   const combinedStream=new MediaStream([
     ...canvasStream.getVideoTracks(),
     ...dest.stream.getAudioTracks()
   ]);

   const ch=[];
   mr=new MediaRecorder(combinedStream,{mimeType:m,videoBitsPerSecond:8e6});
   mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
   mr.onstop=()=>{
     const a=document.createElement("a");
     a.href=URL.createObjectURL(new Blob(ch,{type:m.split(";")[0]}));
     a.download="bittrix-reel."+(m.includes("mp4")?"mp4":"webm");
     a.click();rec=false;btn.disabled=false;btn.textContent="Record 3s video (download)"
   };

   btn.disabled=true;btn.textContent="Recording...";
   t0=performance.now();voicePlayed=false;rec=true;
   audioEl.currentTime=0;
   audioEl.play().catch(()=>{});
   mr.start();
 } catch(err) {
   const ch=[];
   mr=new MediaRecorder(c.captureStream(30),{mimeType:m,videoBitsPerSecond:8e6});
   mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
   mr.onstop=()=>{
     const a=document.createElement("a");
     a.href=URL.createObjectURL(new Blob(ch,{type:m.split(";")[0]}));
     a.download="bittrix-reel."+(m.includes("mp4")?"mp4":"webm");
     a.click();rec=false;btn.disabled=false;btn.textContent="Record 3s video (download)"
   };
   btn.disabled=true;btn.textContent="Recording...";
   t0=performance.now();voicePlayed=false;rec=true;
   audioEl.currentTime=0;
   audioEl.play().catch(()=>{});
   mr.start();
 }
};
</script></body></html>
